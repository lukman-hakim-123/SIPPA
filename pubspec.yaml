name: sippa
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  appwrite: ^19.0.0
  flutter_launcher_icons: ^0.14.4
  fpdart: ^1.1.0
  change_app_package_name: ^1.3.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  bcrypt: ^1.1.3
  flutter_dotenv: ^6.0.0
  go_router: ^16.2.1
  google_fonts: ^6.2.1
  double_tap_to_exit: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_native_splash: ^2.4.6
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.11
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.0
  json_serializable: ^6.8.0
  freezed: ^3.2.3

dependency_overrides:
  flutter_web_auth_2: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/sippa.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: assets/icons/sippa_splash.png
  color_dark: "#ffffff"
  android: true
  ios: true

  android_12:
    color: "#ffffff"
    image: assets/icons/sippa_splash.png
    color_dark: "#ffffff"
    icon_background_color: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/.env

  fonts:
    - family: inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
